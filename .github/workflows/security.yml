name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm audit --include=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          skip-dirs: .git,.cache,node_modules

  container:
    name: Container build, smoke, and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull --tag trackerr:ci .
      - name: Verify production startup and access boundaries
        shell: bash
        run: |
          container=$(docker run --detach --publish 127.0.0.1::3000 \
            --env ALLOWED_HOSTS=http://127.0.0.1:3000 trackerr:ci)
          trap 'docker logs "$container"; docker rm --force --volumes "$container"' EXIT
          origin="http://$(docker port "$container" 3000/tcp)"
          curl_args=(--silent --show-error --header 'Host: 127.0.0.1:3000')
          curl "${curl_args[@]}" --fail --retry 15 --retry-delay 1 --retry-all-errors \
            "$origin/login" > /dev/null
          test "$(curl "${curl_args[@]}" --output /dev/null --write-out '%{http_code}' "$origin/")" = 303
          test "$(curl "${curl_args[@]}" --output /dev/null --write-out '%{http_code}' "$origin/api/search")" = 401
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Host: untrusted.example' "$origin/login")" = 421
      - name: Report image vulnerabilities, including unfixed issues
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: trackerr:ci
          scanners: vuln
          format: json
          output: trivy-image.json
          exit-code: '0'
      - name: Block fixable high and critical image vulnerabilities
        run: trivy image --cache-dir .cache/trivy --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 trackerr:ci
      - name: Save image vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-vulnerabilities
          path: trivy-image.json
          if-no-files-found: ignore
          retention-days: 7
